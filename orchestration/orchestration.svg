<title id="dc-b669bb5e24-title">Claude Code orchestration</title>
<desc id="dc-b669bb5e24-desc">A trigger starts an orchestrator that plans, dispatches cheap explorer and mid-tier writer workers, gates results through a fresh-context verifier, and either ships or retries with feedback.</desc>
