<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 760" width="860" height="760" role="img" aria-labelledby="dc-9935af8c2d-title dc-9935af8c2d-desc" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title id="dc-9935af8c2d-title">Triage: the facts decide the route</title>
<desc id="dc-9935af8c2d-desc">A risky task goes to the reviewed route when it is small, otherwise to the pipeline. A task that is not risky goes to the pipeline when it touches 12 or more files or splits into parallel slices, and to a plain session otherwise. The fifth fact, code, does not change the route; it decides whether git worktrees are used and, in headless runs, whether web tools are allowed.</desc>
