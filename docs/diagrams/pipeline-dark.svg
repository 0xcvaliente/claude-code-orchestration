<text x="388" y="519.5" font-size="18" font-weight="650" fill="#f0f6fc" text-anchor="start" data-node-text="integrate"><tspan x="388" dy="0">Integrate</tspan></text>
<text x="388" y="545.5" font-size="13" font-weight="400" fill="#9198a1" text-anchor="start" data-node-text="integrate"><tspan x="388" dy="0">Merge passing branches</tspan></text>
</g>
<g id="dc-8821694e01-node-result" data-node="result" data-x="370" data-y="614" data-w="280" data-h="84">
<rect x="370" y="614" width="280" height="84" rx="6" fill="#0f2a4a" stroke="#4493f8" stroke-width="2"/>
<text x="388" y="653.5" font-size="18" font-weight="650" fill="#f0f6fc" text-anchor="start" data-node-text="result"><tspan x="388" dy="0">Result branch</tspan></text>
<text x="388" y="679.5" font-size="13" font-weight="400" fill="#9198a1" text-anchor="start" data-node-text="result"><tspan x="388" dy="0">orch/&lt;id&gt;/result</tspan></text>
</g>
<g data-label="e-pass-test" data-x="482" data-y="298" data-w="56" data-h="30"><rect x="482" y="298" width="56" height="30" rx="4" fill="#0d1117"/>
<text x="490" y="317" font-size="13" font-weight="400" fill="#f0f6fc" text-anchor="start"><tspan x="490" dy="0">pass</tspan></text>
</g>
<g data-label="e-pass-verify" data-x="482" data-y="436" data-w="56" data-h="30"><rect x="482" y="436" width="56" height="30" rx="4" fill="#0d1117"/>
