<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 730" width="1060" height="730" role="img" aria-labelledby="dc-1ced876da7-title dc-1ced876da7-desc" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title id="dc-1ced876da7-title">Pipeline for code in a git repository: plan, then build each slice behind two gates, with validated retries</title>
<desc id="dc-1ced876da7-desc">For code in a git repository: Opus plans questions, Haiku explores, and the plan splits the work into up to 6 slices. Each slice is written by Sonnet in its own worktree and must pass the test gate (a bugfix slice also needs a test that fails before the fix) and a fresh-context reviewer. Failing tests go back to the writer. A review&#x27;s gaps first go to a fresh reviewer that keeps only the gaps that stand: confirmed gaps start a retry (the second attempt resumes the same writer, the third and last is a fresh writer on Opus); when none stand, the slice moves on to be merged. The same gap in two failed reviews in a row stalls the slice until one replan plans the missing work. Passing slices are merged into the result branch. Validation, the Opus attempt and the stall belong to the native orchestrator (the gated workflow validates and escalates too, without the stall gate); the SDK pipeline sends the gaps straight back. Work that changes no code follows the same plan and review steps in your folder.</desc>
