<text x="388" y="403.5" font-size="13" font-weight="400" fill="#9198a1" text-anchor="start" data-node-text="verify"><tspan x="388" dy="0">Fresh-context reviewer</tspan></text>
</g>
<g id="dc-8821694e01-node-integrate" data-node="integrate" data-x="370" data-y="480" data-w="280" data-h="84">
