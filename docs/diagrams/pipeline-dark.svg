<text x="48" y="394.5" font-size="13" font-weight="400" fill="#9198a1" text-anchor="start" data-node-text="plan"><tspan x="48" dy="0">Up to 6, disjoint files, one</tspan><tspan x="48" dy="18">acceptance check each</tspan></text>
</g>
<g id="dc-8821694e01-node-write" data-node="write" data-x="370" data-y="70" data-w="280" data-h="84">
<rect x="370" y="70" width="280" height="84" rx="6" fill="#151b23" stroke="#656c76" stroke-width="1.5"/>
<text x="388" y="109.5" font-size="18" font-weight="650" fill="#f0f6fc" text-anchor="start" data-node-text="write"><tspan x="388" dy="0">Write in parallel</tspan></text>
<text x="388" y="135.5" font-size="13" font-weight="400" fill="#9198a1" text-anchor="start" data-node-text="write"><tspan x="388" dy="0">Sonnet, a worktree each</tspan></text>
</g>
<g id="dc-8821694e01-node-test" data-node="test" data-x="370" data-y="204" data-w="280" data-h="84">
<rect x="370" y="204" width="280" height="84" rx="6" fill="#151b23" stroke="#656c76" stroke-width="1.5"/>
<text x="388" y="243.5" font-size="18" font-weight="650" fill="#f0f6fc" text-anchor="start" data-node-text="test"><tspan x="388" dy="0">Test gate</tspan></text>
<text x="388" y="269.5" font-size="13" font-weight="400" fill="#9198a1" text-anchor="start" data-node-text="test"><tspan x="388" dy="0">Runs your command; no model</tspan></text>
</g>
<g id="dc-8821694e01-node-verify" data-node="verify" data-x="370" data-y="338" data-w="280" data-h="84">
<rect x="370" y="338" width="280" height="84" rx="6" fill="#151b23" stroke="#656c76" stroke-width="1.5"/>
