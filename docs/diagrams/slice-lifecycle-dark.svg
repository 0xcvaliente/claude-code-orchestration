<polyline data-edge="t-start" points="80,76 80,176" fill="none" stroke="#9198a1" stroke-width="2" stroke-linejoin="round" marker-end="url(#dc-d599a95580-arrow)"/>
<polyline data-edge="t-done" points="210,192 360,192" fill="none" stroke="#9198a1" stroke-width="2" stroke-linejoin="round" marker-end="url(#dc-d599a95580-arrow)"/>
<polyline data-edge="t-fail" points="360,226 210,226" fill="none" stroke="#9198a1" stroke-width="2" stroke-linejoin="round" marker-end="url(#dc-d599a95580-arrow)" stroke-dasharray="6 5"/>
<polyline data-edge="t-pass" points="540,208 690,208" fill="none" stroke="#9198a1" stroke-width="2" stroke-linejoin="round" marker-end="url(#dc-d599a95580-arrow)"/>
<polyline data-edge="t-gaps" points="780,176 780,126 160,126 160,176" fill="none" stroke="#9198a1" stroke-width="2" stroke-linejoin="round" marker-end="url(#dc-d599a95580-arrow)" stroke-dasharray="6 5"/>
<polyline data-edge="t-retries" points="120,240 120,330" fill="none" stroke="#9198a1" stroke-width="2" stroke-linejoin="round" marker-end="url(#dc-d599a95580-arrow)"/>
<polyline data-edge="t-replan" points="120,386 120,474" fill="none" stroke="#9198a1" stroke-width="2" stroke-linejoin="round" marker-end="url(#dc-d599a95580-arrow)"/>
<polyline data-edge="t-review-pass" points="780,240 780,330" fill="none" stroke="#9198a1" stroke-width="2" stroke-linejoin="round" marker-end="url(#dc-d599a95580-arrow)"/>
<polyline data-edge="t-merge" points="780,386 780,474" fill="none" stroke="#9198a1" stroke-width="2" stroke-linejoin="round" marker-end="url(#dc-d599a95580-arrow)"/>
<g id="dc-d599a95580-node-planned" data-node="planned" data-x="30" data-y="20" data-w="180" data-h="56">
