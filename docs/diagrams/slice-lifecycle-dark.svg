<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img" aria-labelledby="dc-d599a95580-title dc-d599a95580-desc" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title id="dc-d599a95580-title">One slice&#x27;s life: from planned to merged or replaced</title>
<desc id="dc-d599a95580-desc">A planned slice is written, tested and reviewed. Failing tests or review gaps send it back to writing. A slice that passes review is merged into the result branch; one that uses up its retries fails and may be replaced by a replan.</desc>
