<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 844" width="1080" height="844" role="img" aria-labelledby="gates-dark-title gates-dark-desc" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title id="gates-dark-title">Native gates: hooks that block an agent from finishing</title>
<desc id="gates-dark-desc">The orchestrator sends the plan to a reviewer. When it launches an implementer, plan-check.mjs blocks the launch for overlapping files, a dependency cycle or a missing plan review, and otherwise lets it through. When the implementer tries to finish, verify.sh runs the tests unless there is no test runner or, in a git work tree, only prose changed: on failure it blocks the implementer with the test output; when they pass or are skipped, the report reaches the orchestrator. A reviewer returns STATUS pass or fail, and review-gate.mjs blocks the orchestrator's final reply until a reviewer has passed the last implementer.</desc>
