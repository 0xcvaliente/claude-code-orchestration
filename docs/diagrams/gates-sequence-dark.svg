<rect x="98" y="279" width="213.8" height="17" rx="3" fill="#0d1117"/>
<text x="102" y="292" font-size="12" font-weight="600" fill="#9198a1" text-anchor="start">[tests pass or skipped]</text>
<line x1="450" y1="328" x2="92" y2="328" stroke="#9198a1" stroke-width="2" marker-end="url(#gates-dark-open)" stroke-dasharray="7 5"/>
<rect x="235.7" y="303" width="68.6" height="19" rx="3" fill="#0d1117"/>
<text x="270.0" y="317" font-size="13" font-weight="400" fill="#f0f6fc" text-anchor="middle">allowed</text>
<line x1="90" y1="388" x2="628" y2="388" stroke="#9198a1" stroke-width="2" marker-end="url(#gates-dark-filled)"/>
<rect x="290.6" y="363" width="138.8" height="19" rx="3" fill="#0d1117"/>
<text x="360.0" y="377" font-size="13" font-weight="400" fill="#f0f6fc" text-anchor="middle">review the slice</text>
<line x1="630" y1="430" x2="92" y2="430" stroke="#9198a1" stroke-width="2" marker-end="url(#gates-dark-open)" stroke-dasharray="7 5"/>
<rect x="275.0" y="405" width="170.0" height="19" rx="3" fill="#0d1117"/>
<text x="360.0" y="419" font-size="13" font-weight="400" fill="#f0f6fc" text-anchor="middle">STATUS: pass or fail</text>
<line x1="90" y1="472" x2="808" y2="472" stroke="#9198a1" stroke-width="2" marker-end="url(#gates-dark-filled)"/>
<rect x="400.1" y="447" width="99.8" height="19" rx="3" fill="#0d1117"/>
<text x="450.0" y="461" font-size="13" font-weight="400" fill="#f0f6fc" text-anchor="middle">final reply</text>
<line x1="810" y1="514" x2="92" y2="514" stroke="#9198a1" stroke-width="2" marker-end="url(#gates-dark-open)" stroke-dasharray="7 5"/>
<rect x="240.2" y="489" width="419.6" height="19" rx="3" fill="#0d1117"/>
<text x="450.0" y="503" font-size="13" font-weight="400" fill="#f0f6fc" text-anchor="middle">blocked until a reviewer passes the last implementer</text>
<text x="30" y="572" font-size="12" font-weight="400" fill="#9198a1" text-anchor="start">Solid arrow: call or event. Dashed arrow: reply or hook decision. Time runs down.</text>
</svg>
