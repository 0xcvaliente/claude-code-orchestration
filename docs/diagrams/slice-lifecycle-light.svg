<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" width="900" height="680" role="img" aria-labelledby="dc-78c64ecfad-title dc-78c64ecfad-desc" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title id="dc-78c64ecfad-title">One slice&#x27;s life: from planned to merged, failed for good or replaced</title>
<desc id="dc-78c64ecfad-desc">A planned slice is written, then tested unless there are no tests to run (no test command, or only prose changed in a git repository), then reviewed. Failing tests, or a bugfix slice without a test that fails before the fix, send it back to writing. A failed review&#x27;s gaps are validated by a fresh reviewer: confirmed gaps send the slice back to writing for its second attempt (the same writer, resumed) or its third and last (a fresh writer on Opus); when none stand, the slice counts as passed. The same gap in two failed reviews in a row stalls the slice, and a replan replaces it; if the run already had its replan, or three attempts fail, the slice has failed for good. A passed slice is merged into the result branch.</desc>
