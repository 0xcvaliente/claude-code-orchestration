<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 700" width="880" height="700" role="img" aria-labelledby="dc-30eb6b7354-title dc-30eb6b7354-desc" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title id="dc-30eb6b7354-title">Routes: how triage sends a task to one of three routes</title>
<desc id="dc-30eb6b7354-desc">Triage sends a task to a plain session, a plain session plus a fresh reviewer, or the pipeline. Plain and reviewed runs leave their results in place when their checks pass; when checks fail, the task escalates to the pipeline, which leaves git branches for code in a git repository and files in place otherwise.</desc>
<defs><marker id="dc-30eb6b7354-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 4 L0 8 Z" fill="#59636e"/></marker></defs>
<rect width="880" height="700" fill="#ffffff" aria-hidden="true"/>
<polyline data-edge="e-triage" points="440,76 440,116" fill="none" stroke="#59636e" stroke-width="2" stroke-linejoin="round" marker-end="url(#dc-30eb6b7354-arrow)"/>
<polyline data-edge="e-plain" points="380,192 380,226 140,226 140,300" fill="none" stroke="#59636e" stroke-width="2" stroke-linejoin="round" marker-end="url(#dc-30eb6b7354-arrow)"/>
<polyline data-edge="e-reviewed" points="440,192 440,300" fill="none" stroke="#59636e" stroke-width="2" stroke-linejoin="round" marker-end="url(#dc-30eb6b7354-arrow)"/>
<polyline data-edge="e-pipeline" points="500,192 500,226 740,226 740,300" fill="none" stroke="#59636e" stroke-width="2" stroke-linejoin="round" marker-end="url(#dc-30eb6b7354-arrow)"/>
<polyline data-edge="e-plain-checks" points="140,376 140,490 190,490" fill="none" stroke="#59636e" stroke-width="2" stroke-linejoin="round" marker-end="url(#dc-30eb6b7354-arrow)"/>
<polyline data-edge="e-reviewed-checks" points="440,376 440,404 290,404 290,430" fill="none" stroke="#59636e" stroke-width="2" stroke-linejoin="round" marker-end="url(#dc-30eb6b7354-arrow)"/>
<polyline data-edge="e-yes" points="290,550 290,600" fill="none" stroke="#59636e" stroke-width="2" stroke-linejoin="round" marker-end="url(#dc-30eb6b7354-arrow)"/>
<polyline data-edge="e-escalate" points="390,490 690,490 690,376" fill="none" stroke="#59636e" stroke-width="2" stroke-linejoin="round" marker-end="url(#dc-30eb6b7354-arrow)" stroke-dasharray="6 5"/>
<polyline data-edge="e-branches" points="800,376 800,600" fill="none" stroke="#59636e" stroke-width="2" stroke-linejoin="round" marker-end="url(#dc-30eb6b7354-arrow)"/>
<g id="dc-30eb6b7354-node-task" data-node="task" data-x="340" data-y="20" data-w="200" data-h="56">
<rect x="340" y="20" width="200" height="56" rx="6" fill="#f6f8fa" stroke="#818b98" stroke-width="1.5"/>
<text x="358" y="54.5" font-size="18" font-weight="650" fill="#1f2328" text-anchor="start" data-node-text="task"><tspan x="358" dy="0">Your task</tspan></text>
</g>
<g id="dc-30eb6b7354-node-triage" data-node="triage" data-x="280" data-y="116" data-w="320" data-h="76">
<rect x="280" y="116" width="320" height="76" rx="6" fill="#f6f8fa" stroke="#818b98" stroke-width="1.5"/>
<text x="298" y="151.5" font-size="18" font-weight="650" fill="#1f2328" text-anchor="start" data-node-text="triage"><tspan x="298" dy="0">Triage</tspan></text>
<text x="298" y="177.5" font-size="13" font-weight="400" fill="#59636e" text-anchor="start" data-node-text="triage"><tspan x="298" dy="0">Sonnet, read-only, about 20k tokens</tspan></text>
</g>
<g id="dc-30eb6b7354-node-plain" data-node="plain" data-x="20" data-y="300" data-w="240" data-h="76">
<rect x="20" y="300" width="240" height="76" rx="6" fill="#f6f8fa" stroke="#818b98" stroke-width="1.5"/>
<text x="38" y="335.5" font-size="18" font-weight="650" fill="#1f2328" text-anchor="start" data-node-text="plain"><tspan x="38" dy="0">Plain</tspan></text>
<text x="38" y="361.5" font-size="13" font-weight="400" fill="#59636e" text-anchor="start" data-node-text="plain"><tspan x="38" dy="0">One agent, this session</tspan></text>
</g>
<g id="dc-30eb6b7354-node-reviewed" data-node="reviewed" data-x="290" data-y="300" data-w="300" data-h="76">
<rect x="290" y="300" width="300" height="76" rx="6" fill="#f6f8fa" stroke="#818b98" stroke-width="1.5"/>
<text x="308" y="335.5" font-size="18" font-weight="650" fill="#1f2328" text-anchor="start" data-node-text="reviewed"><tspan x="308" dy="0">Reviewed</tspan></text>
<text x="308" y="361.5" font-size="13" font-weight="400" fill="#59636e" text-anchor="start" data-node-text="reviewed"><tspan x="308" dy="0">Plain session + fresh reviewer</tspan></text>
</g>
<g id="dc-30eb6b7354-node-pipeline" data-node="pipeline" data-x="620" data-y="300" data-w="240" data-h="76">
<rect x="620" y="300" width="240" height="76" rx="6" fill="#f6f8fa" stroke="#818b98" stroke-width="1.5"/>
<text x="638" y="335.5" font-size="18" font-weight="650" fill="#1f2328" text-anchor="start" data-node-text="pipeline"><tspan x="638" dy="0">Pipeline</tspan></text>
<text x="638" y="361.5" font-size="13" font-weight="400" fill="#59636e" text-anchor="start" data-node-text="pipeline"><tspan x="638" dy="0">Orchestrator + workers</tspan></text>
</g>
<g id="dc-30eb6b7354-node-checks" data-node="checks" data-x="190" data-y="430" data-w="200" data-h="120">
<polygon points="290.0,430 390,490.0 290.0,550 190,490.0" fill="#f6f8fa" stroke="#818b98" stroke-width="2"/>
<text x="290.0" y="485.0" font-size="18" font-weight="650" fill="#1f2328" text-anchor="middle" data-node-text="checks"><tspan x="290.0" dy="0">Checks</tspan><tspan x="290.0" dy="23">pass?</tspan></text>
</g>
<g id="dc-30eb6b7354-node-working" data-node="working" data-x="160" data-y="600" data-w="260" data-h="76">
<rect x="160" y="600" width="260" height="76" rx="6" fill="#f6f8fa" stroke="#818b98" stroke-width="1.5"/>
<text x="178" y="635.5" font-size="18" font-weight="650" fill="#1f2328" text-anchor="start" data-node-text="working"><tspan x="178" dy="0">Results in place</tspan></text>
<text x="178" y="661.5" font-size="13" font-weight="400" fill="#59636e" text-anchor="start" data-node-text="working"><tspan x="178" dy="0">Uncommitted, if in git</tspan></text>
</g>
<g id="dc-30eb6b7354-node-branches" data-node="branches" data-x="580" data-y="600" data-w="290" data-h="76">
<rect x="580" y="600" width="290" height="76" rx="6" fill="#f6f8fa" stroke="#818b98" stroke-width="1.5"/>
<text x="598" y="635.5" font-size="18" font-weight="650" fill="#1f2328" text-anchor="start" data-node-text="branches"><tspan x="598" dy="0">Branches or files</tspan></text>
<text x="598" y="661.5" font-size="13" font-weight="400" fill="#59636e" text-anchor="start" data-node-text="branches"><tspan x="598" dy="0">Branches for code in git</tspan></text>
</g>
<g data-label="e-plain" data-x="50" data-y="246" data-w="180" data-h="30"><rect x="50" y="246" width="180" height="30" rx="4" fill="#ffffff"/>
<text x="58" y="265" font-size="13" font-weight="400" fill="#1f2328" text-anchor="start"><tspan x="58" dy="0">small or sequential</tspan></text>
</g>
<g data-label="e-reviewed" data-x="365" data-y="246" data-w="150" data-h="30"><rect x="365" y="246" width="150" height="30" rx="4" fill="#ffffff"/>
<text x="373" y="265" font-size="13" font-weight="400" fill="#1f2328" text-anchor="start"><tspan x="373" dy="0">small but risky</tspan></text>
</g>
<g data-label="e-pipeline" data-x="627" data-y="246" data-w="226" data-h="30"><rect x="627" y="246" width="226" height="30" rx="4" fill="#ffffff"/>
<text x="635" y="265" font-size="13" font-weight="400" fill="#1f2328" text-anchor="start"><tspan x="635" dy="0">parallel, large or risky</tspan></text>
</g>
<g data-label="e-yes" data-x="265" data-y="560" data-w="50" data-h="30"><rect x="265" y="560" width="50" height="30" rx="4" fill="#ffffff"/>
<text x="273" y="579" font-size="13" font-weight="400" fill="#1f2328" text-anchor="start"><tspan x="273" dy="0">yes</tspan></text>
</g>
<g data-label="e-escalate" data-x="478" data-y="475" data-w="124" data-h="30"><rect x="478" y="475" width="124" height="30" rx="4" fill="#ffffff"/>
<text x="486" y="494" font-size="13" font-weight="400" fill="#1f2328" text-anchor="start"><tspan x="486" dy="0">no: escalate</tspan></text>
</g>
</svg>
