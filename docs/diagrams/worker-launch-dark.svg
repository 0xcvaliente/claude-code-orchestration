<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1040" width="1000" height="1040" role="img" aria-labelledby="dc-7916de2bd9-title dc-7916de2bd9-desc" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title id="dc-7916de2bd9-title">Worker launch: how plan-check.mjs shapes a launch before the worker starts</title>
<desc id="dc-7916de2bd9-desc">Every Agent launch passes plan-check.mjs first. A launch that breaks a plan rule is blocked and the reason goes back to the orchestrator. An allowed launch of the plugin&#x27;s researcher that names SOURCES goes through the read router when it is switched on: each file is profiled with local tools, the cheapest adequate tier is picked, and the model is raised to that tier, never lowered. An allowed launch of the plugin&#x27;s implementer, researcher or reviewer gets skill hints: from the user, synced, project and plugin skills found on disk, up to 3 suggestions (1 for a reviewer) are appended to the brief as names and reason codes. Both changes go out in one updatedInput with an allow. Built-ins, fork and the integrator, and launches with nothing to add, start unchanged.</desc>
