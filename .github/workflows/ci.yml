name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      # The benchmark graders' oracle is the Python 3.13 stdlib.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Tests shell out to bash and git (both preinstalled on ubuntu-latest); tests that commit need an identity.
      - name: Configure git identity
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.com"
      # The file profiler's PDF tests (src/file-profile.test.mjs) need poppler; they skip without it.
      - name: Install poppler
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      - run: npm ci
      - run: npm run check
      # The dashboard (mod) test runs `claude plugin validate` and `claude plugin test`; neither needs a login (probed on
      # 2.1.326 with an empty HOME: docs/data/probes-2.0.0-w4.md). Pinned to the Claude Code the Agent SDK carries.
      - name: Install the Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.326
      - run: npm run test-dashboard
